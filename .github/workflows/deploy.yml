# Builds the static export and rsyncs it to the staging subdomain over SSH.
#
# STAGING ONLY. The destination is a constant below, and a guard refuses to run
# if it is ever edited to point anywhere else. Nothing here can write to the
# live site in public_html; that cutover is manual, and only when asked for.
#
# Requires these repository secrets:
#   SSH_PRIVATE_KEY - the deploy key, unencrypted, BEGIN/END lines included
#   SSH_HOST        - vmls.edu.in
#   SSH_USER        - the cPanel username
#   SSH_PORT        - optional, defaults to 22
name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# rsync --delete is not atomic: a cancelled run leaves the subdomain
# half-updated. Queue runs rather than cancelling one mid-transfer.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Relative to the SSH user's home directory.
  TARGET: public_html/staging.vmls.edu.in

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # redirects.ts is the single source for the 301s, so regenerate rather
      # than trust the committed copy to still match it.
      - name: Generate .htaccess
        run: node scripts/generate-htaccess.mjs

      - name: Build static export
        run: npm run build

      # Staging serves the same pages as the live site, so without this it
      # would be crawled as duplicate content against vmls.edu.in.
      - name: Apply staging overlay
        run: node scripts/staging-overlay.mjs out

      # A build that "succeeds" but drops .htaccess would publish a site where
      # every extensionless URL 404s. Catch that here, not on the subdomain.
      - name: Verify the export before uploading
        run: |
          set -e
          for f in out/index.html out/.htaccess out/404.html out/robots.txt out/sitemap.xml; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          count=$(find out -type f | wc -l)
          echo "$count files to deploy"
          test "$count" -gt 5000 || { echo "::error::only $count files - the export looks incomplete"; exit 1; }
          # -x, because production robots.txt has "Disallow: /blogs/..." lines
          # that a substring match would happily accept.
          if ! grep -qx 'Disallow: /' out/robots.txt; then
            echo "::error::robots.txt is not blocking crawlers - refusing to publish an indexable staging copy"; exit 1
          fi
          if ! grep -q 'X-Robots-Tag' out/.htaccess; then
            echo "::error::.htaccess is missing the noindex header"; exit 1
          fi

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Deriving the public half proves the secret survived copy-paste, and
          # prints the fingerprint to compare against the key cPanel authorised.
          # A "Permission denied (publickey)" later is then unambiguous: the key
          # is fine and the server has simply not been told to accept it.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub || {
            echo "::error::SSH_PRIVATE_KEY is not a usable private key - re-copy it including the BEGIN and END lines"; exit 1
          }
          echo "deploy key: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"
          # Pin the host key rather than disabling host checking outright.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || {
            echo "::error::no SSH host key from $SSH_HOST:$SSH_PORT - wrong port, or SSH is firewalled"; exit 1
          }

      # Fail here, with a readable message, rather than part-way through an
      # rsync that has already started deleting files.
      - name: Preflight the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -e
          case "$TARGET" in
            */staging.vmls.edu.in) ;;
            *) echo "::error::TARGET is '$TARGET' - this workflow only deploys to the staging subdomain"; exit 1 ;;
          esac
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            set -e
            command -v rsync >/dev/null || { echo 'rsync is not installed on the server'; exit 1; }
            test -d '$TARGET' || { echo 'missing directory: $TARGET'; exit 1; }
            echo \"rsync: \$(rsync --version | head -1)\"
            echo \"target holds \$(find '$TARGET' -type f | wc -l) files right now\"
          "

      # --delete makes the subdomain an exact mirror of out/, so a page deleted
      # from the site actually disappears. Safe only because the destination is
      # the staging directory, which holds nothing but this build.
      #
      # -rltz, not -a: preserving owner and group needs root, which a cPanel
      # account does not have. --chmod sets what Apache needs to serve files.
      - name: Deploy to staging
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -rltz --delete --stats --human-readable \
            --chmod=D755,F644 \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/id_ed25519 -o BatchMode=yes" \
            out/ "$SSH_USER@$SSH_HOST:$TARGET/"

      - name: Confirm what landed
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            cd '$TARGET'
            echo \"files on server: \$(find . -type f | wc -l)\"
            for f in index.html .htaccess robots.txt sitemap.xml 404.html; do
              test -s \"\$f\" && echo \"  ok  \$f\" || { echo \"  MISSING \$f\"; exit 1; }
            done
          "
